name: CD Hom

on:
  push:
    branches: ["homol"]
  workflow_dispatch:

jobs:
  build:
    uses: YuriMarco94/pipeline-templates/.github/workflows/build-template-aws.yml@main
    secrets: inherit
    with:
      environment: hom
      aws-region: us-east-1
      ecr-repository: org-app
      dockerfile-path: Dockerfile
      context: .
      tag-strategy: sha

  deploy:
    needs: [build]
    uses: SEU_ORG/pipeline-templates/.github/workflows/deploy-template-eks.yml@master
    secrets: inherit
    with:
      aws-region: us-east-1
      eks-cluster-name: yurim-aws-platform-dev-us-east-1-eks
      manifest-path: k8s/apps/namespaces/hom/
      namespace: hom
      deployment-name: echo
      container-name: echo
      image-uri: ${{ needs.build.outputs.image-uri }}
      rollout-timeout: 180s
