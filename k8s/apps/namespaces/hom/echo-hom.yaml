apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: hom
  labels:
    app: echo
    environment: hom
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
        environment: hom
    spec:
      containers:
        - name: echo
          image: ealen/echo-server:0.6.0
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: hom
spec:
  selector:
    app: echo
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo
  namespace: hom
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/subnets: subnet-0d2c14439d0dc06c6,subnet-0b7b9e3ad1e2c9924
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /echo-hom
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 80