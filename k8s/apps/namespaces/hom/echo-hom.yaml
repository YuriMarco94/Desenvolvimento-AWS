apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: hom
  labels:
    app: echo
    environment: hom
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
        environment: hom
    spec:
      containers:
        - name: echo
          image: 597088058179.dkr.ecr.us-east-1.amazonaws.com/org-app:hom-latest
          ports:
            - containerPort: 80
          env:
            - name: ENVIRONMENT
              value: "hom"
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: hom
spec:
  selector:
    app: echo
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo
  namespace: hom
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /echo-hom
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 80