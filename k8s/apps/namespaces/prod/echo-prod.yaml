apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: prod
  labels:
    app: echo
    environment: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
        environment: prod
    spec:
      containers:
        - name: echo
          image: ealen/echo-server:0.6.0
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: prod
spec:
  selector:
    app: echo
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo
  namespace: prod
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/subnets: subnet-0d2c14439d0dc06c6,subnet-0b7b9e3ad1e2c9924
    # Para certificado, descomente e ajuste:
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:597088058179:certificate/SEU-CERTIFICADO-AQUI
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /echo-prod
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 80